<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F7F6;--surf:#FFFFFF;--ink:#14202B;--mute:#5B6B76;--line:#DCE5E2;--acc:#14181B;--acc-ink:#FFFFFF;--soft:#ECEFEE;--kcal:#EF476F;--warm:#FFD166;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1,h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700;margin:0 0 12px;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}
.sub{color:var(--mute);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:9px 15px;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);padding:16px;font:700 17px Unbounded,Manrope,sans-serif;cursor:pointer;margin:6px 0 18px}
.btn.sm{display:inline-block;width:auto;font:700 14px Manrope,sans-serif;padding:9px 14px;border-radius:12px;margin:0}
.btn.ghost{background:var(--soft);color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{font:700 18px/1.3 Manrope,sans-serif;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute);margin:0 0 10px}
.kcal{color:var(--kcal);font-weight:700}
.tag{background:var(--soft);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;color:var(--ink)}
ul.ing,ol.st{margin:6px 0 12px;padding-left:20px}
ul.ing li,ol.st li{margin:3px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fav{margin-left:auto}
.day{display:flex;gap:10px;align-items:flex-start}
.day .d{font:700 15px Unbounded,sans-serif;width:34px;flex:none;padding-top:2px}
.day .b{flex:1;min-width:0}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.sum{font-weight:700;margin:4px 0 16px}
label.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
label.chk input{width:22px;height:22px;accent-color:var(--acc)}
label.chk input:checked+span{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);padding:20px 4px}
.slot{padding:10px 0;border-top:1px solid var(--line)}.sl{font-size:13px;color:var(--mute);font-weight:700}
.normrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;margin:0 0 12px}.normrow input{width:110px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:700 16px Manrope,sans-serif;background:var(--surf);color:var(--ink)}
#app{padding-bottom:70px}
button{transition:transform .15s,background .2s,color .2s,box-shadow .2s}
.btn:active,.chip:active,nav button:active{transform:scale(.95)}
.chip[aria-pressed="true"]{transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.fab{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(528px,calc(100% - 32px));margin:0;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab:active{transform:translateX(-50%) scale(.97)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.in{animation:slin .35s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.beat{animation:beat .4s}
@keyframes beat{40%{transform:scale(1.18)}}
.dtop{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ringw{position:relative;width:112px;height:112px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb,.rf{fill:none;stroke-width:9}.rb{stroke:var(--line)}.rf{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.rc b{font:700 22px Unbounded,sans-serif}.rc span{font-size:12px;color:var(--mute)}
.dl{flex:1;min-width:0}.sum2{font-weight:700;margin-bottom:8px}
.bar{margin:8px 0}.bl{display:flex;justify-content:space-between;font-size:14px}.bt{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.bt i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.3,.8,.3,1)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.item span{flex:1}
.x{border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;padding:6px 8px}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.macros span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
details.dayc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin:0 0 12px}
details.dayc>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font:700 17px Manrope,sans-serif}
details.dayc>summary::after{content:'›';font-size:22px;transition:transform .25s;transform:rotate(90deg)}
details.dayc[open]>summary::after{transform:rotate(-90deg)}
.tx{background:linear-gradient(currentColor,currentColor) 0 55%/0 2px no-repeat;transition:background-size .3s,color .3s}
label.chk input:checked+.tx{background-size:100% 2px;color:var(--mute);text-decoration:none}
.mute{color:var(--mute);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;margin:0 0 12px;transition:opacity .25s}
.seg.off{opacity:.45}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--acc);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg[data-pos="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:11px 8px;border-radius:999px;font:700 15px Manrope,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--acc-ink)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F171C;--surf:#18232A;--ink:#EAF1F0;--mute:#9BB0B3;--line:#2A3A42;--acc:#EDEFEE;--acc-ink:#111417;--soft:#22313A;--kcal:#FF7A98}
html.theming *{transition:background-color .45s,color .45s,border-color .45s,fill .45s,stroke .45s!important}
h1{padding-right:52px}
.theme{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:6;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;padding:0;overflow:hidden}
.theme svg{position:absolute;inset:7px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.theme .sun{opacity:0;transform:rotate(-90deg) scale(.3)}
:root[data-theme="dark"] .theme .sun{opacity:1;transform:none}
:root[data-theme="dark"] .theme .moon{opacity:0;transform:rotate(90deg) scale(.3)}
#app.enter>*:not(.fab){animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
#app.enter>:nth-child(2){animation-delay:.05s}#app.enter>:nth-child(3){animation-delay:.1s}#app.enter>:nth-child(4){animation-delay:.15s}#app.enter>:nth-child(5){animation-delay:.2s}#app.enter>:nth-child(6){animation-delay:.25s}#app.enter>:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.btn:not(.fab),.chip{position:relative}.btn,.chip{overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.pf{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:700 16px Manrope,system-ui,sans-serif;cursor:pointer;padding:0}
.fi{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:600 16px Manrope,system-ui,sans-serif;background:var(--surf);color:var(--ink);margin:0 0 10px}
textarea.fi{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.cc{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font:600 14px Manrope,system-ui,sans-serif;margin:0 6px 8px 0}
.cc input{accent-color:var(--acc)}
.ok{color:#3BA776;font-weight:700}
.wrow{display:flex;gap:16px;align-items:center}
.glass{width:84px;height:105px;flex:none;color:var(--ink)}
.wr{flex:1;min-width:0}.wr h2{margin:0 0 6px}
.wv{transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.wave{fill:#4B7BE5;opacity:.85;animation:slosh 2.4s linear infinite}
@keyframes slosh{to{transform:translateX(40px)}}
.plot{position:relative;display:flex;gap:8px;height:150px;align-items:flex-end;margin-top:22px}
.pc{flex:1;height:100%;display:flex;align-items:flex-end}
.pc i{display:block;width:100%;height:0;border-radius:8px 8px 4px 4px;background:var(--acc);transition:height .8s cubic-bezier(.3,.8,.3,1)}
.pc i.over{background:var(--kcal)}
.nl{position:absolute;left:0;right:0;border-top:2px dashed var(--mute);opacity:.7;pointer-events:none}
.nl span{position:absolute;right:0;top:-20px;font-size:12px;color:var(--mute);font-weight:700}
.xl{display:flex;gap:8px;margin-top:6px}.xl span{flex:1;text-align:center;font-size:13px;font-weight:700;display:flex;flex-direction:column;line-height:1.3}.xl b{font-size:11px;color:var(--mute);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:13px 4px;font:700 13px Manrope,sans-serif;cursor:pointer}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
</style>

<script>
const P=(s)=>s.split(';').map(x=>{const a=x.split('|');return{n:a[0],q:parseFloat(a[1]),u:a[2]}});
const R=[
{id:1,n:'Курица с рисом и овощами',k:420,p:34,t:30,w:['work','week'],i:P('куриное филе|150|г;рис|60|г;замороженные овощи|100|г;соевый соус|1|ст. л.;растительное масло|1|ч. л.'),s:['Отварите рис.','Нарежьте филе и обжарьте 7 минут.','Добавьте овощи и соевый соус, тушите 5 минут.','Смешайте с рисом и разложите по контейнеру.']},
{id:2,n:'Куриные котлеты с гречкой',k:390,p:36,t:40,w:['work','week'],i:P('куриный фарш|150|г;гречка|60|г;свежий огурец|1|шт.'),s:['Смешайте фарш со специями, посолите.','Запекайте котлеты 25 минут при 190°C.','Отварите гречку.','Подавайте с огурцом.']},
{id:3,n:'Боул с курицей и булгуром',k:410,p:33,t:30,w:['work'],i:P('куриное филе|130|г;булгур|60|г;свежий огурец|1|шт.;помидор|1|шт.;натуральный йогурт|2|ст. л.'),s:['Отварите булгур и курицу.','Нарежьте овощи.','Соберите всё в контейнер, йогурт добавьте сверху как соус.']},
{id:4,n:'Куриный салат с яйцом',k:310,p:30,t:15,w:['work','week'],i:P('куриное филе|120|г;яйцо|1|шт.;свежий огурец|1|шт.;натуральный йогурт|2|ст. л.;зелень|0.5|пучка'),s:['Отварите филе и яйцо.','Нарежьте всё кубиками.','Заправьте йогуртом и посыпьте зеленью.']},
{id:5,n:'Омлет с овощами',k:280,p:20,t:10,w:['breakfast','week','weekend'],i:P('яйцо|2|шт.;молоко|50|мл;помидор|1|шт.;сыр|20|г'),s:['Взбейте яйца с молоком.','Выложите нарезанный помидор на сковороду, залейте яйцами.','Посыпьте сыром и накройте крышкой на 5 минут.']},
{id:6,n:'Запечённая курица с картофелем',k:450,p:35,t:60,w:['weekend'],i:P('куриные бёдра без кожи|200|г;картофель|200|г;чеснок|1|зубчик;паприка|1|ч. л.;растительное масло|1|ч. л.'),s:['Смешайте курицу со специями и маслом.','Выложите с картофелем на противень.','Запекайте 45 минут при 200°C.']},
{id:7,n:'Куриный суп с лапшой',k:250,p:22,t:40,w:['work','week','weekend'],i:P('куриное филе|100|г;лапша|30|г;морковь|0.5|шт.;картофель|100|г'),s:['Сварите бульон из филе 20 минут.','Добавьте картофель и морковь.','За 5 минут до конца положите лапшу.']},
{id:8,n:'Лосось с брокколи',k:400,p:32,t:25,w:['week','weekend'],i:P('лосось|150|г;брокколи|150|г;лимон|0.25|шт.;растительное масло|1|ч. л.'),s:['Выложите лосось и брокколи на противень.','Сбрызните маслом и лимоном.','Запекайте 15 минут при 200°C.']},
{id:9,n:'Паста с курицей и шпинатом',k:460,p:36,t:25,w:['week'],i:P('паста|70|г;куриное филе|120|г;шпинат|50|г;сливки 10%|50|мл;чеснок|1|зубчик'),s:['Отварите пасту.','Обжарьте курицу с чесноком.','Добавьте шпинат и сливки на 3 минуты.','Смешайте с пастой.']},
{id:10,n:'Творожная запеканка',k:230,p:24,t:45,w:['breakfast','weekend'],i:P('творог 5%|150|г;яйцо|1|шт.;манка|1|ст. л.;яблоко|0.5|шт.'),s:['Смешайте творог, яйцо и манку.','Добавьте нарезанное яблоко.','Запекайте 30 минут при 180°C.']},
{id:11,n:'Чили с индейкой и фасолью',k:340,p:32,t:45,w:['work','weekend'],i:P('фарш из индейки|130|г;консервированная фасоль|80|г;томаты в собственном соку|100|г;паприка|1|ч. л.'),s:['Обжарьте фарш 8 минут.','Добавьте томаты, фасоль и паприку.','Тушите 20 минут. На следующий день вкуснее.']},
{id:12,n:'Лаваш-ролл с курицей',k:350,p:28,t:15,w:['work'],i:P('тонкий лаваш|1|шт.;куриное филе|100|г;листья салата|30|г;помидор|0.5|шт.;натуральный йогурт|1|ст. л.'),s:['Отварите и нарежьте курицу.','Смажьте лаваш йогуртом, выложите начинку.','Заверните и разрежьте пополам.']},
{id:13,n:'Греческий салат с курицей',k:330,p:28,t:15,w:['work','week'],i:P('куриное филе|100|г;свежий огурец|1|шт.;помидор|1|шт.;фета|30|г;оливковое масло|1|ч. л.'),s:['Отварите курицу.','Нарежьте овощи и фету.','Заправьте маслом. Для работы храните заправку отдельно.']},
{id:14,n:'Тушёная курица с кабачком',k:300,p:32,t:30,w:['week','work'],i:P('куриное филе|150|г;кабачок|200|г;томатная паста|1|ст. л.'),s:['Обжарьте курицу.','Добавьте кабачок и томатную пасту.','Тушите под крышкой 15 минут.']},
{id:15,n:'Сырники',k:270,p:22,t:25,w:['breakfast','weekend'],i:P('творог 5%|150|г;яйцо|1|шт.;мука|2|ст. л.;натуральный йогурт|1|ст. л.'),s:['Смешайте творог, яйцо и муку.','Сформируйте сырники.','Обжарьте на антипригарной сковороде по 3 минуты с каждой стороны.']},
{id:16,n:'Овсянка с бананом и орехами',k:320,p:12,t:10,w:['breakfast'],i:P('овсяные хлопья|50|г;молоко|150|мл;банан|0.5|шт.;грецкие орехи|10|г'),s:['Сварите хлопья на молоке 5 минут.','Добавьте нарезанный банан и орехи.']},
{id:17,n:'Скрэмбл с тостом',k:330,p:22,t:10,w:['breakfast'],i:P('яйцо|2|шт.;цельнозерновой хлеб|1|ломтик;помидор|0.5|шт.'),s:['Взбейте яйца и приготовьте на слабом огне, помешивая.','Подсушите хлеб, добавьте помидор.']},
{id:18,n:'Йогурт с ягодами и мюсли',k:250,p:16,t:5,w:['breakfast'],i:P('греческий йогурт|150|г;ягоды|80|г;мюсли|20|г'),s:['Выложите йогурт в миску.','Добавьте ягоды и мюсли.']},
{id:19,n:'Тост с яйцом и творожным сыром',k:230,p:14,t:10,w:['breakfast'],i:P('цельнозерновой хлеб|1|ломтик;яйцо|1|шт.;творожный сыр|30|г'),s:['Сварите яйцо.','Намажьте сыр на хлеб и выложите яйцо кружочками.']},
{id:20,n:'Творог с ягодами',k:150,p:18,t:3,w:['snack'],i:P('творог 5%|100|г;ягоды|50|г'),s:['Смешайте творог с ягодами.']},
{id:21,n:'Яблоко с арахисовой пастой',k:175,p:4,t:3,w:['snack'],i:P('яблоко|1|шт.;арахисовая паста|1|ст. л.'),s:['Нарежьте яблоко дольками.','Подавайте с пастой.']},

function genPlan(){

  let p=pool(ctx,S.cap).filter(r=>!used.includes(r.id));

 S.done={};save();
}

function slots(i){return [['Завтрак','breakfast'],['Обед',i<5?'work':'weekend'],['Ужин','week'],['Перекус','snack']]}
function ok(ctx,r){return r.w.includes(ctx)&&(ctx==='breakfast'||ctx==='snack'||!r.w.includes('breakfast'))}
function calc(d){const t=d.m.reduce((a,id)=>a+byId(id).k,0);d.f=Math.round(Math.min(1.6,Math.max(.7,S.norm/t))*20)/20;return d}

function dstr(){const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function dayIdx(){return (new Date().getDay()+6)%7}

function okb(ctx,r){if(ctx==='dinner')return !r.w.includes('breakfast')&&!r.w.includes('snack')&&(r.w.includes('work')||r.w.includes('weekend'));return r.w.includes(ctx)&&(ctx==='breakfast'||ctx==='snack'||!r.w.includes('breakfast'))}
function tot(items){const t={k:0,p:0,c:0,f:0,fb:0};items.forEach(x=>{const r=byId(x.id);t.k+=r.k*x.f;t.p+=r.p*x.f;t.c+=r.c*x.f;t.f+=r.f*x.f;t.fb+=r.fb*x.f});return t}

function card(r,open,pop,add){

 return `<div class="card${pop?' pop':''}"><h3>${r.n}</h3><div class="meta"><span class="kcal">${r.k} ккал</span><span>${r.t} мин</span></div><div class="macros"><span>Б ${r.p}</span><span>У ${r.c}</span><span>Ж ${r.f}</span><span>Кл ${r.fb}</span></div><div class="meta">${r.w.map(w=>`<span class="tag">${CTX[w]}</span>`).join('')}</div>${open&&r.i.length?`<b>Продукты на 1 порцию</b><ul class="ing">${r.i.map(x=>`<li>${x.n}: ${fmt(x.q)} ${x.u}</li>`).join('')}</ul><b>Как готовить</b><ol class="st">${r.s.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}<div class="row">${open?'':`<button class="btn sm ghost" data-a="open" data-id="${r.id}">Рецепт</button>`}${add?`<button class="btn sm" data-a="add" data-id="${r.id}">Добавить в сегодня</button>`:''}<button class="btn sm ghost fav${beat?' beat':''}" data-a="fav" data-id="${r.id}" aria-pressed="${fav}">${fav?'♥ В избранном':'♡ В избранное'}</button></div></div>`;
}

 return `<h1>Сегодня</h1><p class="sub">Цели считаются от нормы: 30% белков, 40% углеводов, 30% жиров. Б — белки, У — углеводы, Ж — жиры, Кл — клетчатка.</p><div class="card"><div class="dtop"><div class="ringw"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5" data-off="${off}"/></svg><div class="rc"><b data-k="${Math.round(T.k)}">${Math.round(T.k)}</b><span>ккал</span></div></div><div class="dl"><div class="sum2">${left>=0?`Осталось ${left} ккал`:`Выше нормы на ${-left} ккал`}</div>${normRow()}</div></div>${bar('Белки',T.p,S.norm*.3/4,'var(--kcal)')}${bar('Углеводы',T.c,S.norm*.4/4,'var(--warm)')}${bar('Жиры',T.f,S.norm*.3/9,'#4B7BE5')}${bar('Клетчатка',T.fb,25,'#3BA776')}</div>
 ${waterCard()}<div class="card"><h2>Что съедено</h2>${list}${S.plan.length?`<button class="btn sm ghost" data-a="takeplan" style="margin-top:10px">Взять меню на сегодня</button>`:''}</div>

}
function viewWeek(){
 const head=`<h1>Меню на неделю</h1><p class="sub">Завтрак, обед, ужин и перекус на каждый день. Размер порций подстраивается под вашу норму.</p>${normRow()}<button class="btn" data-a="gen">${S.plan.length?'Собрать заново':'Собрать меню'}</button>`;
 if(!S.plan.length)return head+'<p class="empty">Меню пока пустое.</p>';
 return head+S.plan.map((d,i)=>{const T=tot(d.m.map(id=>({id:id,f:d.f}))),op=S.open[i]===undefined?i===dayIdx():S.open[i];
  return `<details class="dayc" data-day="${i}" ${op?'open':''}><summary><span>${DAYL[i]}</span><span class="kcal">${Math.round(T.k)} ккал</span></summary><div class="macros"><span>Б ${Math.round(T.p)}</span><span>У ${Math.round(T.c)}</span><span>Ж ${Math.round(T.f)}</span><span>Кл ${Math.round(T.fb)}</span><span>порции ×${d.f}</span></div>`+d.m.map((id,j)=>{const r=byId(id);return `<div class="slot"><div class="sl">${SL[j]}</div><details><summary>${r.n}</summary><ul class="ing">${r.i.map(x=>`<li>${x.n}: ${fmt(x.q*d.f)} ${x.u}</li>`).join('')}</ul><ol class="st">${r.s.map(x=>`<li>${x}</li>`).join('')}</ol></details><div class="meta" style="margin:4px 0 8px"><span class="kcal">${Math.round(r.k*d.f)} ккал</span><span>${r.t} мин</span></div><button class="btn sm ghost" data-a="swap2" data-i="${i}" data-j="${j}">Заменить</button></div>`}).join('')+'</details>'}).join('');
}

 const h=document.documentElement;
 if(anim){h.classList.add('theming');setTimeout(()=>h.classList.remove('theming'),500)}
 h.dataset.theme=t;try{localStorage.setItem('chto-theme',t)}catch(e){}
 try{const tg=window.Telegram&&Telegram.WebApp;if(tg){const c=t==='dark'?'#0F171C':'#F4F7F6';tg.setHeaderColor(c);tg.setBackgroundColor(c)}}catch(e){}
}
document.getElementById('theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
setTheme(document.documentElement.dataset.theme||'light',false);
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.chip');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),600)});
document.addEventListener('click',e=>{const b=e.target.closest('button,summary');if(!b)return;try{const h=Telegram.WebApp.HapticFeedback;if(b.dataset.a==='add')h.notificationOccurred('success');else h.impactOccurred('light')}catch(_){}},true);
const EX=[['fish','рыбы',/лосось|треска|тунец|минтай/i],['chicken','курицы',/кури|курин/i],['egg','яиц',/яйцо/i],['dairy','молочного',/творог|йогурт|сыр|молоко|сливки|кефир|моцарелла|фета/i],['mush','грибов',/шампиньон/i]];
S.hist={};S.ex=[];S.wgoal=2000;S.dv='all';S.dt='';S.q='';S.msg='';
try{const x=JSON.parse(localStorage.getItem('chto-extra')||'null');if(x){S.hist=x.hist||{};S.ex=x.ex||[];S.wgoal=x.wgoal||2000;(x.custom||[]).forEach(r=>{if(!R.find(q=>q.id===r.id))R.push(r)})}}catch(e){}
function allowed(r){return !r.del&&!S.ex.some(k=>{const e=EX.find(x=>x[0]===k);return e&&r.i.some(i=>e[2].test(i.n))})}
function ok(ctx,r){return okb(ctx,r)&&!r.del&&(allowed(r)||!R.some(x=>okb(ctx,x)&&allowed(x)))}
function pool(ctx,cap,skip){const b=R.filter(r=>r.w.includes(ctx)&&r.id!==skip&&!r.del&&(!cap||r.k<=cap));const a=b.filter(allowed);return a.length?a:b}
function dk(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function liveH(){const t=tot(S.today.items);return{k:Math.round(t.k),p:Math.round(t.p),c:Math.round(t.c),f:Math.round(t.f),fb:Math.round(t.fb),w:S.today.water||0}}
function saveX(){try{localStorage.setItem('chto-extra',JSON.stringify({hist:S.hist,ex:S.ex,wgoal:S.wgoal,custom:R.filter(r=>r.custom)}))}catch(e){}}
function saveT(){
 try{localStorage.setItem('chto-today',JSON.stringify(S.today))}catch(e){}
 try{const h=liveH();if(h.k>0||h.w>0)S.hist[S.today.d]=h;else delete S.hist[S.today.d];const ks=Object.keys(S.hist);while(ks.length>45)delete S.hist[ks.shift()]}catch(e){}
 saveX();
}
function waterCard(){
 const w=S.today.water||0,g=S.wgoal,fr=Math.min(1,w/g),y=Math.round(96-82*fr),py=S.wy===undefined?96:S.wy;
 return `<div class="card"><div class="wrow"><svg class="glass" viewBox="0 0 80 100" aria-hidden="true"><defs><clipPath id="gc"><path d="M14 8h52l-6 84a6 6 0 0 1-6 5H26a6 6 0 0 1-6-5z"/></clipPath></defs><g clip-path="url(#gc)"><g class="wv" data-y="${y}" style="transform:translateY(${py}px)"><path class="wave" d="M-80 6q10-6 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0V120H-80z"/></g></g><path d="M14 8h52l-6 84a6 6 0 0 1-6 5H26a6 6 0 0 1-6-5z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><div class="wr"><h2>Вода</h2><div class="sum2">${w} / ${g} мл</div>${w>=g?'<div class="ok">Цель достигнута 🎉</div>':''}<div class="chips"><button class="chip" data-a="wadd" data-v="200">+200</button><button class="chip" data-a="wadd" data-v="300">+300</button><button class="chip" data-a="wadd" data-v="500">+500</button><button class="chip" data-a="wadd" data-v="-200">−200</button></div></div></div><label class="normrow"><span>Цель, мл</span><input type="number" inputmode="numeric" min="500" max="6000" step="100" value="${g}" data-a="wgoal"></label></div>`;
}
function dishList(){
 const q=S.q.trim().toLowerCase();
 const L=R.filter(r=>allowed(r)&&(S.dv==='all'||(S.dv==='fav'&&S.favs.includes(r.id))||(S.dv==='my'&&r.custom))&&(!S.dt||r.w.includes(S.dt))&&(!q||r.n.toLowerCase().includes(q)||r.i.some(i=>i.n.toLowerCase().includes(q))));
 return L.length?L.map(r=>{const c=card(r,false,false,true);return r.custom?c.replace(/<\/div><\/div>$/,`<button class="btn sm ghost" data-a="delc" data-id="${r.id}">Удалить</button></div></div>`):c}).join(''):'<p class="empty">Ничего не найдено.</p>';
}
function viewDishes(){
 const chip=(a,v,l,on)=>`<button class="chip" data-a="${a}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
 const msg=S.msg;S.msg='';
 return `<h1>Блюда</h1><p class="sub">Поиск, фильтры и ваши собственные блюда.</p>
 <input id="q" class="fi" type="search" placeholder="Поиск по названию или продукту" value="${S.q.replace(/"/g,'&quot;')}">
 <div class="chips">${[['all','Все'],['fav','♥ Избранное'],['my','Мои']].map(m=>chip('dv',m[0],m[1],S.dv===m[0])).join('')}</div>
 <div class="chips">${Object.keys(CTX).map(k=>chip('dt',k,CTX[k],S.dt===k)).join('')}</div>
 <p class="mute">Не предлагать в подборе и меню:</p>
 <div class="chips">${EX.map(e=>chip('ex',e[0],'без '+e[1],S.ex.includes(e[0]))).join('')}</div>
 <details class="dayc" data-day="cf" ${S.open.cf?'open':''}><summary><span>Добавить своё блюдо</span></summary>
 <input id="cf-n" class="fi" placeholder="Название">
 <div class="g2"><input id="cf-k" class="fi" type="number" inputmode="decimal" placeholder="Ккал"><input id="cf-t" class="fi" type="number" inputmode="numeric" placeholder="Минут"><input id="cf-p" class="fi" type="number" inputmode="decimal" placeholder="Белки, г"><input id="cf-c" class="fi" type="number" inputmode="decimal" placeholder="Углеводы, г"><input id="cf-f" class="fi" type="number" inputmode="decimal" placeholder="Жиры, г"><input id="cf-fb" class="fi" type="number" inputmode="decimal" placeholder="Клетчатка, г"></div>
 <div>${Object.keys(CTX).map(k=>`<label class="cc"><input type="checkbox" name="cf-w" value="${k}">${CTX[k]}</label>`).join('')}</div>
 <textarea id="cf-i" class="fi" placeholder="Продукты, по одному в строке: курица 150 г"></textarea>
 <textarea id="cf-s" class="fi" placeholder="Шаги приготовления, по одному в строке"></textarea>
 <button class="btn" data-a="addc">Сохранить блюдо</button></details>
 ${msg?`<p class="ok">${msg}</p>`:''}
 <div id="dl">${dishList()}</div>`;
}
function viewStats(){
 const D=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const h=i===0?liveH():S.hist[dk(d)];D.push({lbl:DAYS[(d.getDay()+6)%7],h:h&&(h.k>0||h.w>0)?h:null})}
 const mx=Math.max(S.norm*1.3,...D.map(x=>x.h?x.h.k:0)),nf=S.norm/mx*100;
 const have=D.filter(x=>x.h&&x.h.k>0),av=f=>have.length?Math.round(have.reduce((a,x)=>a+x.h[f],0)/have.length):0;
 const inn=have.filter(x=>Math.abs(x.h.k-S.norm)<=S.norm*.1).length;
 const wd=D.filter(x=>x.h&&x.h.w>0),aw=wd.length?Math.round(wd.reduce((a,x)=>a+x.h.w,0)/wd.length):0;
 return `<h1>Итоги недели</h1><p class="sub">Калории за последние 7 дней. Данные появляются, когда вы добавляете блюда в «Сегодня».</p><div class="card"><div class="plot"><div class="nl" style="bottom:${nf}%"><span>норма ${S.norm}</span></div>${D.map(x=>`<div class="pc"><i data-hh="${x.h?Math.min(100,x.h.k/mx*100):0}"${x.h&&x.h.k>S.norm*1.1?' class="over"':''}></i></div>`).join('')}</div><div class="xl">${D.map(x=>`<span>${x.lbl}<b>${x.h&&x.h.k?x.h.k:'–'}</b></span>`).join('')}</div></div>
 <div class="card"><h2>Средние показатели</h2>${have.length?`<div class="macros"><span>${av('k')} ккал</span><span>Б ${av('p')}</span><span>У ${av('c')}</span><span>Ж ${av('f')}</span><span>Кл ${av('fb')}</span></div><p>Дней в пределах нормы (±10%): <b>${inn}</b> из ${have.length}</p>`:'<p class="empty">Пока нет данных.</p>'}${aw?`<p>Вода в среднем: <b>${aw} мл</b> в день</p>`:''}</div>`;
}
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const l=document.getElementById('dl');if(l)l.innerHTML=dishList()}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-a="wgoal"]');if(b){S.wgoal=Math.min(6000,Math.max(500,+b.value||2000));saveX();render()}});
render();
</script>
</body>
</html>
