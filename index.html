<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что приготовить</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
:root{--bg:#F4F7F6;--surf:#FFFFFF;--ink:#14202B;--mute:#5B6B76;--line:#DCE5E2;--acc:#14181B;--acc-ink:#FFFFFF;--soft:#ECEFEE;--kcal:#EF476F;--warm:#FFD166;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1,h2{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:700;margin:0 0 12px;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}
.sub{color:var(--mute);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:9px 15px;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--acc);color:var(--acc-ink);padding:16px;font:700 17px Unbounded,Manrope,sans-serif;cursor:pointer;margin:6px 0 18px}
.btn.sm{display:inline-block;width:auto;font:700 14px Manrope,sans-serif;padding:9px 14px;border-radius:12px;margin:0}
.btn.ghost{background:var(--soft);color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h3{font:700 18px/1.3 Manrope,sans-serif;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute);margin:0 0 10px}
.kcal{color:var(--kcal);font-weight:700}
.tag{background:var(--soft);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;color:var(--ink)}
ul.ing,ol.st{margin:6px 0 12px;padding-left:20px}
ul.ing li,ol.st li{margin:3px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fav{margin-left:auto}
.day{display:flex;gap:10px;align-items:flex-start}
.day .d{font:700 15px Unbounded,sans-serif;width:34px;flex:none;padding-top:2px}
.day .b{flex:1;min-width:0}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.sum{font-weight:700;margin:4px 0 16px}
label.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
label.chk input{width:22px;height:22px;accent-color:var(--acc)}
label.chk input:checked+span{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);padding:20px 4px}
.slot{padding:10px 0;border-top:1px solid var(--line)}.sl{font-size:13px;color:var(--mute);font-weight:700}
.normrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700;margin:0 0 12px}.normrow input{width:110px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:700 16px Manrope,sans-serif;background:var(--surf);color:var(--ink)}
#app{padding-bottom:70px}
button{transition:transform .15s,background .2s,color .2s,box-shadow .2s}
.btn:active,.chip:active,nav button:active{transform:scale(.95)}
.chip[aria-pressed="true"]{transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.fab{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(528px,calc(100% - 32px));margin:0;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab:active{transform:translateX(-50%) scale(.97)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.in{animation:slin .35s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.beat{animation:beat .4s}
@keyframes beat{40%{transform:scale(1.18)}}
.dtop{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ringw{position:relative;width:112px;height:112px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb,.rf{fill:none;stroke-width:9}.rb{stroke:var(--line)}.rf{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.rc b{font:700 22px Unbounded,sans-serif}.rc span{font-size:12px;color:var(--mute)}
.dl{flex:1;min-width:0}.sum2{font-weight:700;margin-bottom:8px}
.bar{margin:8px 0}.bl{display:flex;justify-content:space-between;font-size:14px}.bt{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.bt i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.3,.8,.3,1)}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.item span{flex:1}
.x{border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;padding:6px 8px}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.macros span{background:var(--soft);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
details.dayc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:4px 16px;margin:0 0 12px}
details.dayc>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font:700 17px Manrope,sans-serif}
details.dayc>summary::after{content:'›';font-size:22px;transition:transform .25s;transform:rotate(90deg)}
details.dayc[open]>summary::after{transform:rotate(-90deg)}
.tx{background:linear-gradient(currentColor,currentColor) 0 55%/0 2px no-repeat;transition:background-size .3s,color .3s}
label.chk input:checked+.tx{background-size:100% 2px;color:var(--mute);text-decoration:none}
.mute{color:var(--mute);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;margin:0 0 12px;transition:opacity .25s}
.seg.off{opacity:.45}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--acc);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg[data-pos="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:11px 8px;border-radius:999px;font:700 15px Manrope,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:color .3s}
.seg button[aria-pressed="true"]{color:var(--acc-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:13px 4px;font:700 13px Manrope,sans-serif;cursor:pointer}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
</style>
</head>

{id:11,n:'Чили с индейкой и фасолью',k:340,p:32,t:45,w:['work','weekend'],i:P('фарш из индейки|130|г;консервированная фасоль|80|г;томаты в собственном соку|100|г;паприка|1|ч. л.'),s:['Обжарьте фарш 8 минут.','Добавьте томаты, фасоль и паприку.','Тушите 20 минут. На следующий день вкуснее.']},

{id:14,n:'Тушёная курица с кабачком',k:300,p:32,t:30,w:['week','work'],i:P('куриное филе|150|г;кабачок|200|г;томатная паста|1|ст. л.'),s:['Обжарьте курицу.','Добавьте кабачок и томатную пасту.','Тушите под крышкой 15 минут.']},

{id:16,n:'Овсянка с бананом и орехами',k:320,p:12,t:10,w:['breakfast'],i:P('овсяные хлопья|50|г;молоко|150|мл;банан|0.5|шт.;грецкие орехи|10|г'),s:['Сварите хлопья на молоке 5 минут.','Добавьте нарезанный банан и орехи.']},
{id:17,n:'Скрэмбл с тостом',k:330,p:22,t:10,w:['breakfast'],i:P('яйцо|2|шт.;цельнозерновой хлеб|1|ломтик;помидор|0.5|шт.'),s:['Взбейте яйца и приготовьте на слабом огне, помешивая.','Подсушите хлеб, добавьте помидор.']},
{id:18,n:'Йогурт с ягодами и мюсли',k:250,p:16,t:5,w:['breakfast'],i:P('греческий йогурт|150|г;ягоды|80|г;мюсли|20|г'),s:['Выложите йогурт в миску.','Добавьте ягоды и мюсли.']},

{id:20,n:'Творог с ягодами',k:150,p:18,t:3,w:['snack'],i:P('творог 5%|100|г;ягоды|50|г'),s:['Смешайте творог с ягодами.']},
{id:21,n:'Яблоко с арахисовой пастой',k:175,p:4,t:3,w:['snack'],i:P('яблоко|1|шт.;арахисовая паста|1|ст. л.'),s:['Нарежьте яблоко дольками.','Подавайте с пастой.']},

];
const CTX={breakfast:'Завтрак',work:'На работу',weekend:'Выходной',snack:'Перекус'};
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let S={tab:'today',ctx:'work',cap:0,cur:null,plan:[],favs:[],mult:1,done:{},norm:1600};
try{const x=JSON.parse(localStorage.getItem('chto-prigotovit')||'null');if(x){S.plan=x.plan||[];S.favs=x.favs||[];S.mult=x.mult||1;S.norm=x.norm||1600}}catch(e){}
if(S.plan.length&&!S.plan[0].m)S.plan=[];
function save(){try{localStorage.setItem('chto-prigotovit',JSON.stringify({plan:S.plan,favs:S.favs,mult:S.mult,norm:S.norm}))}catch(e){}}
const byId=id=>R.find(r=>r.id===id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pool(ctx,cap,skip){return R.filter(r=>r.w.includes(ctx)&&(!cap||r.k<=cap)&&r.id!==skip)}
function fmt(q){return Math.round(q*10)/10}
function card(r,open){
 const fav=S.favs.includes(r.id);

function genPlan(){

 S.done={};save();
}

 else if(a==='swap'){const i=+b.dataset.i,ctx=i<5?(i%2===0?'work':'week'):'weekend';const p=pool(ctx,S.cap,S.plan[i]).filter(r=>!S.plan.includes(r.id));S.plan[i]=(p.length?pick(p):pick(pool(ctx,0,S.plan[i]))).id;save()}

 else if(a==='takeplan'){const d=S.plan[dayIdx()];if(d){S.today.items=d.m.map(m=>({id:m,f:d.f}));saveT()}}
 else if(a==='swap2'){const i=+b.dataset.i,j=+b.dataset.j,d=S.plan[i],cur=byId(d.m[j]),ctx=slots(i)[j][1];const c=R.filter(r=>ok(ctx,r)&&!d.m.includes(r.id));const n=c.filter(r=>Math.abs(r.k-cur.k)<=80);d.m[j]=pick(n.length?n:c).id;calc(d);save()}
 else if(a==='done'){S.done[v]=b.checked;return}

});
const DAYL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],SL=['Завтрак','Обед','Ужин','Перекус'];
function slots(i){return [['Завтрак','breakfast'],['Обед',i<5?'work':'weekend'],['Ужин','week'],['Перекус','snack']]}
function ok(ctx,r){return r.w.includes(ctx)&&(ctx==='breakfast'||ctx==='snack'||!r.w.includes('breakfast'))}
function calc(d){const t=d.m.reduce((a,id)=>a+byId(id).k,0);d.f=Math.round(Math.min(1.6,Math.max(.7,S.norm/t))*20)/20;return d}
function genPlan(){const used={};S.plan=DAYS.map((x,i)=>{let best=null,bd=1e9;for(let t=0;t<80;t++){const day=slots(i).map(s=>{const p=R.filter(r=>ok(s[1],r)),f=p.filter(r=>!used[r.id]);return pick(f.length?f:p).id});if(new Set(day).size<day.length)continue;const dd=Math.abs(day.reduce((a,id)=>a+byId(id).k,0)-S.norm);if(dd<bd){bd=dd;best=day}}if(!best)best=slots(i).map(s=>R.find(r=>ok(s[1],r)).id);best.forEach(id=>used[id]=1);return calc({m:best})});S.done={};save()}

{id:54,n:'Куриные пельмени с йогуртовым соусом',k:420,p:26,c:52,f:12,fb:3,t:20,w:['weekend'],i:P('куриные пельмени|150|г;натуральный йогурт|2|ст. л.'),s:['Отварите пельмени 8 минут.','Подавайте с йогуртом.']},
{id:57,n:'Курица в сливочно-грибном соусе с рисом',k:440,p:33,c:50,f:12,fb:3,t:35,w:['work','weekend'],i:P('куриное филе|130|г;шампиньоны|100|г;сливки 10%|50|мл;рис|50|г'),s:['Отварите рис.','Обжарьте курицу и грибы 10 минут.','Добавьте сливки и тушите 5 минут.']},
{id:58,n:'Фаршированные перцы с индейкой',k:330,p:27,c:37,f:8,fb:6,t:50,w:['work','weekend'],i:P('болгарский перец|2|шт.;фарш из индейки|100|г;рис|30|г;томатная паста|1|ст. л.'),s:['Смешайте фарш с сырым рисом.','Нафаршируйте перцы и залейте водой с томатной пастой.','Тушите 35 минут.']},
{id:59,n:'Омлет в лаваше',k:300,p:18,c:34,f:10,fb:4,t:10,w:['breakfast'],i:P('тонкий лаваш|0.5|шт.;яйцо|2|шт.;помидор|1|шт.;сыр|15|г'),s:['Приготовьте омлет с помидором.','Заверните в лаваш с сыром.']},
{id:62,n:'Паста с тунцом и помидорами',k:440,p:30,c:62,f:8,fb:5,t:20,w:['weekend'],i:P('паста|70|г;тунец в собственном соку|80|г;помидор|2|шт.;чеснок|1|зубчик'),s:['Отварите пасту.','Обжарьте помидоры с чесноком 5 минут, добавьте тунец.','Смешайте с пастой.']},
{id:63,n:'Киноа с курицей и овощами',k:400,p:32,c:50,f:8,fb:6,t:30,w:['work'],i:P('киноа|60|г;куриное филе|120|г;болгарский перец|1|шт.;свежий огурец|1|шт.'),s:['Отварите киноа.','Обжарьте курицу с перцем 8 минут.','Соберите с огурцом в контейнер.']}
);
R.forEach(r=>{if(MAC[r.id]){r.c=MAC[r.id][0];r.f=MAC[r.id][1];r.fb=MAC[r.id][2]}r.w=r.w.filter(x=>x!=='week');if(!r.w.length)r.w=['weekend']});
function dstr(){const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function dayIdx(){return (new Date().getDay()+6)%7}
function saveT(){try{localStorage.setItem('chto-today',JSON.stringify(S.today))}catch(e){}}
S.today={d:dstr(),items:[]};S.open={};S.day='work';S.meal='main';S.fresh=-1;S.shown=null;S.beat=null;
try{const y=JSON.parse(localStorage.getItem('chto-today')||'null');if(y&&y.d===dstr())S.today=y}catch(e){}
function slots(i){return [['Завтрак','breakfast'],['Обед',i<5?'work':'weekend'],['Ужин','dinner'],['Перекус','snack']]}
function ok(ctx,r){if(ctx==='dinner')return !r.w.includes('breakfast')&&!r.w.includes('snack')&&(r.w.includes('work')||r.w.includes('weekend'));return r.w.includes(ctx)&&(ctx==='breakfast'||ctx==='snack'||!r.w.includes('breakfast'))}
function tot(items){const t={k:0,p:0,c:0,f:0,fb:0};items.forEach(x=>{const r=byId(x.id);t.k+=r.k*x.f;t.p+=r.p*x.f;t.c+=r.c*x.f;t.f+=r.f*x.f;t.fb+=r.fb*x.f});return t}
function bar(l,v,g,col){const w=Math.min(100,g?v/g*100:0);return `<div class="bar"><div class="bl"><span>${l}</span><b>${Math.round(v)} / ${Math.round(g)} г</b></div><div class="bt"><i data-w="${w}" style="background:${col}"></i></div></div>`}
function normRow(){return `<label class="normrow"><span>Норма калорий</span><input type="number" inputmode="numeric" min="1000" max="3500" step="50" value="${S.norm}" data-a="norm"></label>`}
function card(r,open,pop,add){
 const fav=S.favs.includes(r.id),beat=S.beat===r.id;if(beat)S.beat=null;
 return `<div class="card${pop?' pop':''}"><h3>${r.n}</h3><div class="meta"><span class="kcal">${r.k} ккал</span><span>${r.t} мин</span></div><div class="macros"><span>Б ${r.p}</span><span>У ${r.c}</span><span>Ж ${r.f}</span><span>Кл ${r.fb}</span></div><div class="meta">${r.w.map(w=>`<span class="tag">${CTX[w]}</span>`).join('')}</div>${open?`<b>Продукты на 1 порцию</b><ul class="ing">${r.i.map(x=>`<li>${x.n}: ${fmt(x.q)} ${x.u}</li>`).join('')}</ul><b>Как готовить</b><ol class="st">${r.s.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}<div class="row">${open?'':`<button class="btn sm ghost" data-a="open" data-id="${r.id}">Рецепт</button>`}${add?`<button class="btn sm" data-a="add" data-id="${r.id}">Добавить в сегодня</button>`:''}<button class="btn sm ghost fav${beat?' beat':''}" data-a="fav" data-id="${r.id}" aria-pressed="${fav}">${fav?'♥ В избранном':'♡ В избранное'}</button></div></div>`;
}
function viewToday(){
 const T=tot(S.today.items),pop=S.cur!==S.shown;S.shown=S.cur;
 const off=276.5*(1-Math.min(1,T.k/S.norm)),left=Math.round(S.norm-T.k);
 const caps=[[0,'Любые'],[300,'до 300 ккал'],[400,'до 400 ккал'],[450,'до 450 ккал']];
 const list=S.today.items.length?S.today.items.map((x,i)=>{const r=byId(x.id);return `<div class="item${S.fresh===i?' in':''}"><span>${r.n}</span><b class="kcal">${Math.round(r.k*x.f)}</b><button class="x" data-a="rm" data-i="${i}" aria-label="Убрать из сегодняшнего меню">✕</button></div>`}).join(''):'<p class="empty">Пока ничего не добавлено.</p>';
 return `<h1>Сегодня</h1><p class="sub">Цели считаются от нормы: 30% белков, 40% углеводов, 30% жиров. Б — белки, У — углеводы, Ж — жиры, Кл — клетчатка.</p><div class="card"><div class="dtop"><div class="ringw"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5" data-off="${off}"/></svg><div class="rc"><b>${Math.round(T.k)}</b><span>ккал</span></div></div><div class="dl"><div class="sum2">${left>=0?`Осталось ${left} ккал`:`Выше нормы на ${-left} ккал`}</div>${normRow()}</div></div>${bar('Белки',T.p,S.norm*.3/4,'var(--kcal)')}${bar('Углеводы',T.c,S.norm*.4/4,'var(--warm)')}${bar('Жиры',T.f,S.norm*.3/9,'#4B7BE5')}${bar('Клетчатка',T.fb,25,'#3BA776')}</div>
 <div class="card"><h2>Что съедено</h2>${list}${S.plan.length?`<button class="btn sm ghost" data-a="takeplan" style="margin-top:10px">Взять меню на сегодня</button>`:''}</div>
 <h2>Подобрать блюдо</h2><div class="seg${S.meal==='main'?'':' off'}" data-pos="${S.segFrom!==undefined?S.segFrom:(S.day==='weekend'?1:0)}" data-to="${S.day==='weekend'?1:0}"><i class="thumb"></i><button data-a="day" data-v="work" aria-pressed="${S.day==='work'}">На работу</button><button data-a="day" data-v="weekend" aria-pressed="${S.day==='weekend'}">Выходной</button></div><div class="chips">${[['main','Основное блюдо'],['breakfast','Завтрак'],['snack','Перекус']].map(m=>`<button class="chip" data-a="meal" data-v="${m[0]}" aria-pressed="${S.meal===m[0]}">${m[1]}</button>`).join('')}</div><div class="chips">${caps.map(c=>`<button class="chip" data-a="cap" data-v="${c[0]}" aria-pressed="${S.cap===c[0]}">${c[1]}</button>`).join('')}</div>
 ${S.cur?card(byId(S.cur),true,pop,true):'<p class="empty">Нажмите кнопку внизу, и приложение предложит блюдо.</p>'}
 <button class="btn fab" data-a="roll">${S.cur?'Другой вариант':'Подобрать блюдо'}</button>`;
}
function viewWeek(){
 const head=`<h1>Меню на неделю</h1><p class="sub">Завтрак, обед, ужин и перекус на каждый день. Размер порций подстраивается под вашу норму.</p>${normRow()}<button class="btn" data-a="gen">${S.plan.length?'Собрать заново':'Собрать меню'}</button>`;
 if(!S.plan.length)return head+'<p class="empty">Меню пока пустое.</p>';
 return head+S.plan.map((d,i)=>{const T=tot(d.m.map(id=>({id:id,f:d.f}))),op=S.open[i]===undefined?i===dayIdx():S.open[i];
  return `<details class="dayc" data-day="${i}" ${op?'open':''}><summary><span>${DAYL[i]}</span><span class="kcal">${Math.round(T.k)} ккал</span></summary><div class="macros"><span>Б ${Math.round(T.p)}</span><span>У ${Math.round(T.c)}</span><span>Ж ${Math.round(T.f)}</span><span>Кл ${Math.round(T.fb)}</span><span>порции ×${d.f}</span></div>`+d.m.map((id,j)=>{const r=byId(id);return `<div class="slot"><div class="sl">${SL[j]}</div><details><summary>${r.n}</summary><ul class="ing">${r.i.map(x=>`<li>${x.n}: ${fmt(x.q*d.f)} ${x.u}</li>`).join('')}</ul><ol class="st">${r.s.map(x=>`<li>${x}</li>`).join('')}</ol></details><div class="meta" style="margin:4px 0 8px"><span class="kcal">${Math.round(r.k*d.f)} ккал</span><span>${r.t} мин</span></div><button class="btn sm ghost" data-a="swap2" data-i="${i}" data-j="${j}">Заменить</button></div>`}).join('')+'</details>'}).join('');
}
function ing(items){const m={};items.forEach(x=>byId(x.id).i.forEach(y=>{const k=y.n+'|'+y.u;m[k]=(m[k]||0)+y.q*x.f}));return m}
function sec(key,title,m,op){const rows=Object.keys(m).sort().map(k=>{const p=k.split('|'),kk=key+'|'+k;return `<label class="chk"><input type="checkbox" data-a="done" data-v="${kk}" ${S.done[kk]?'checked':''}><span class="tx">${p[0]}: ${fmt(m[k])} ${p[1]}</span></label>`}).join('');return `<details class="dayc" data-day="s${key}" ${op?'open':''}><summary><span>${title}</span><span class="mute">${Object.keys(m).length} шт.</span></summary>${rows}</details>`}
function viewShop(){
 const secs=[];
 if(S.today.items.length)secs.push(sec('t','Сегодня',ing(S.today.items),S.open.st===undefined?true:S.open.st));
 S.plan.forEach((d,i)=>secs.push(sec(i,DAYL[i],ing(d.m.map(id=>({id:id,f:d.f}))),S.open['s'+i]===undefined?i===dayIdx():S.open['s'+i])));
 return `<h1>Покупки</h1><p class="sub">Список по дням: сначала то, что вы выбрали на сегодня, затем меню на неделю.</p>`+(secs.length?secs.join(''):'<p class="empty">Добавьте блюдо на сегодня или соберите меню на неделю.</p>');
}
function render(){
 const v={today:viewToday,week:viewWeek,shop:viewShop,fav:viewFav}[S.tab]();
 document.getElementById('app').innerHTML=v;
 const T=[['today','Сегодня'],['week','Неделя'],['shop','Покупки'],['fav','Избранное']];
 document.getElementById('nav').innerHTML=T.map(t=>`<button data-a="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="true"':''}>${t[1]}</button>`).join('');
 S.fresh=-1;S.segFrom=undefined;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');document.querySelectorAll('[data-off]').forEach(el=>el.style.strokeDashoffset=el.dataset.off);document.querySelectorAll('.seg[data-to]').forEach(e=>e.dataset.pos=e.dataset.to)}));
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="fav"]');if(b)S.beat=+b.dataset.id},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.day!==undefined)S.open[d.dataset.day]=d.open},true);
try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#F4F7F6');tg.setBackgroundColor('#F4F7F6')}catch(e){}}}catch(e){}
render();
</script>
</body>
